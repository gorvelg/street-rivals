<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/street-rivals/public

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/street-rivals/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/street-rivals/public/bundles>
        FallbackResource disabled
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/street-rivals-error.log
    CustomLog ${APACHE_LOG_DIR}/street-rivals-access.log combined
</VirtualHost>